<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact me to discuss web development projects and opportunities.">
<title>Contact | My Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<header class="site-header">
<h1>Contact Me</h1>

<nav aria-label="Main navigation">
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="projects.html">Projects</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>
</header>

<main>
<section class="contact-section" aria-labelledby="contact-heading">
<h2 id="contact-heading">Get In Touch</h2>

<p>
Have a project or opportunity you'd like to discuss?
Complete the form below and I'll get back to you.
</p>

<form action="#" method="post">
<div class="form-group">
<label for="name">Full Name</label>
<input
type="text"
id="name"
name="name"
placeholder="Enter your full name"
minlength="2"
required
>
</div>

<div class="form-group">
<label for="email">Email Address</label>
<input
type="email"
id="email"
name="email"
placeholder="you@example.com"
required
>
</div>

<div class="form-group">
<label for="phone">Phone Number</label>
<input
type="tel"
id="phone"
name="phone"
placeholder="e.g. 0821234567"
pattern="[0-9]{10}"
title="Please enter a 10-digit phone number."
required
>
</div>

<div class="form-group">
<label for="date">Preferred Contact Date</label>
<input
type="date"
id="date"
name="date"
required
>
</div>

<div class="form-group">
<label for="service">What can I help you with?</label>
<select id="service" name="service" required>
<option value="">Please select an option</option>
<option value="website">Website Development</option>
<option value="design">Web Design</option>
<option value="maintenance">Website Maintenance</option>
<option value="other">Other</option>
</select>
</div>

<fieldset>
<legend>Preferred contact method</legend>

<div class="radio-group">
<input
type="radio"
id="contact-email"
name="contact-method"
value="email"
required
>
<label for="contact-email">Email</label>

<input
type="radio"
id="contact-phone"
name="contact-method"
value="phone"
>
<label for="contact-phone">Phone</label>
</div>
</fieldset>

<div class="form-group">
<label for="message">Message</label>
<textarea
id="message"
name="message"
rows="6"
minlength="10"
placeholder="Tell me about your project..."
required
></textarea></textarea>
</div>

<div class="checkbox-group">
<input
type="checkbox"
id="updates"
name="updates"
value="yes"
>
<label for="updates">
I would like to receive occasional updates.
</label>
</div>

<button type="submit">Send Message</button>
</form>
</section>
</main>

<footer class="site-footer">
<p>&copy; 2026 My Portfolio. All rights reserved.</p>
<p>
Contact me at
<a href="mailto:email@example.com">email@example.com</a>
</p>
</footer>
</body>
</html>
